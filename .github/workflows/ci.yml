name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Download Godot 4.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          echo "fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Install graphical sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick bubblewrap libgl1-mesa-dri
          # Ubuntu's hosted test VM may restrict nested unprivileged namespaces by default.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: 'STUDIO_TEST_GRAPHICS=1 GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" node --test studio/preview.test.mjs'
      - name: Godot QA on the exact commit
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.3-stable_linux.x86_64
        run: |
          mkdir -m 700 "$RUNNER_TEMP/godot-qa"
          node --input-type=module -e 'import {qaCommit} from "./studio/once.mjs"; await qaCommit({godot:process.env.GODOT_BIN}, "HEAD", process.argv[1]);' "$RUNNER_TEMP/godot-qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot QA
          path: |
            ${{ runner.temp }}/godot-qa/*.log
            ${{ runner.temp }}/godot-qa/screenshots/*.png
